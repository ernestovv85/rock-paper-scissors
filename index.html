<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
</head>
<body>
    <header>
        <h1>Rock-Paper-Scissors</h1>
    </header>
    <section class="game-area">
        <div class="scoreboard">
            <h2>Score</h2>
            <p id="player-score">Player: 0</p>
            <p id="computer-score">Computer: 0</p>
        </div>
        <div class="choices">
            <button id="rock" class="choice-button">Rock</button>
            <button id="paper" class="choice-button">Paper</button>
            <button id="scissors" class="choice-button">Scissors</button>
        </div>
        <div class="result">
            <h2>Result</h2>
            <p id="result-text">Make your choice!</p>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
